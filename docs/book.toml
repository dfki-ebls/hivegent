[book]
title = "Hivegent"
description = "Agentic system for non-expert users to interact with LLMs guided by experience"
authors = ["Mirko Lenz"]
language = "en"
src = "src/en"

# mermaid.min.js and mermaid-init.js are generated by `mdbook-mermaid install`,
# run from the build (see default.nix) rather than committed; the preprocessor
# binary must be on PATH at build time.
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
git-repository-icon = "fab-github"
git-repository-url = "https://github.com/dfki-ebls/hivegent"
no-section-label = true
smart-punctuation = true
additional-js = ["assets/language-toggle.js", "mermaid.min.js", "mermaid-init.js"]
