# Full example deployment of Hivegent with an OIDC provider (Rauthy).
#
# The all-in-one app image (backend + Caddy proxy/SPA) comes from this repo's Nix
# flake; the database is the upstream pgvector image, web search the upstream
# SearXNG image, and the IdP is the upstream Rauthy image. Build and push the flake image (per platform) with:
#
#   nix build .#packages.x86_64-linux.docker
#   ./result | gzip --fast | skopeo copy docker-archive:/dev/stdin \
#       docker://ghcr.io/dfki-ebls/hivegent:latest
#
# `./result | docker load` works too. The image is provider-agnostic: the SPA
# reads its OIDC issuer/client at runtime from the backend's `/api/v1/config`, which
# the backend derives from HIVEGENT_AUTH__ISSUER (and HIVEGENT_AUTH__FRONTEND_CLIENT_ID,
# default "hivegent-spa"). Point those at whichever provider you run (Rauthy,
# Keycloak, Authentik, Auth0, ...) with no rebuild.
#
# First-run OIDC setup (each consumer does this themselves, since the stack ships no
# client bootstrap): `docker compose up -d`, read the one-time admin password
# from `docker compose logs rauthy`, log in at http://auth.localhost:8081, and
# create a public `hivegent-spa` client (PKCE/S256) with redirect + allowed
# origin `http://localhost:8080`. Then open http://localhost:8080.
#
# Chat bridge (Teams/Slack/...): the all-in-one image can run the Vercel Chat SDK
# bridge as a third in-container service behind the same Caddy. Build the variant
# with `docker.override { enableBridge = true; }` (the `docker` package already
# threads the `bridge` package in), then on the `hivegent` service below: mount a
# `bridge-config.json` at `/data/bridge-config.json` (non-secrets:
# `backendUrl = "http://127.0.0.1:8000"`, `oidc.issuer`, `oidc.clientId`,
# `adapters.teams`, and `teams.appId`, `teams.tenantId`, and `teams.allowedTenants`,
# the Entra tenant ids the bot answers) and pass the secrets like
# the backend's below as `hivegent-bridge.<NAME>`
# (`POSTGRES_URL=postgres://hivegent:hivegent@postgresql:5432/hivegent`,
# `OIDC_CLIENT_SECRET`, and `TEAMS_APP_PASSWORD` for Teams). Caddy then
# routes `/api/webhooks/*` to the bridge. Create a `hivegent-bot` client-credentials
# client in Rauthy (`CLIENT_CREDENTIALS_MAP_SUB = true`), which `auth.service_client_id`
# below makes a read-only service principal over the global workspace.

name: hivegent

services:
  postgresql:
    image: pgvector/pgvector:pg18
    environment:
      # Bootstrap as the `postgres` superuser so the init config below can install
      # the (untrusted) `vector` extension; the backend connects as the
      # unprivileged `hivegent` role that same script creates.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hivegent
    configs:
      # Runs once on first init, as `postgres` against the `hivegent` database.
      - source: postgresql-init
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hivegent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.35.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # Networking. A *.localhost public URL resolves to loopback in the
      # browser automatically, while the backend reaches it by the network
      # alias below, on the same port.
      LISTEN_SCHEME: http
      LISTEN_PORT_HTTP: "8081"
      PUB_URL: auth.localhost:8081
      PROXY_MODE: "false"
      HQL_INSECURE_COOKIE: "true" # the demo serves plain HTTP
      # Single-node embedded Hiqlite database (persisted at /app/data).
      HQL_NODE_ID: "1"
      HQL_NODES: "1 localhost:8100 localhost:8200"
      HQL_SECRET_RAFT: ChangeMeRaftSecretAtLeast16Chars
      HQL_SECRET_API: ChangeMeApiSecretAtLeast16Chars
      # Encryption keys. DEMO ONLY, generate your own for any real deployment.
      ENC_KEYS: bVCyTsGaggVy5yqQ/UzluN29DZW41M3hTSkx6Y3NtZmRuQkR2TnJxUTYzcjQ=
      ENC_KEY_ACTIVE: bVCyTsGaggVy5yqQ
      # WebAuthn / passkeys.
      RP_ID: auth.localhost
      RP_ORIGIN: http://auth.localhost:8081
      RP_NAME: Hivegent SSO
    volumes:
      - rauthy-data:/app/data
    networks:
      default:
        aliases:
          - auth.localhost
    # Loopback alone, since the demo serves plain HTTP with demo secrets.
    ports:
      - "127.0.0.1:8081:8081"
    # Rauthy ships as a distroless image (no shell), so it carries no
    # in-container healthcheck. The backend tolerates it not being ready yet
    # via its restart policy, and the proxy waits on the backend instead.
    restart: unless-stopped

  # Web search for the agent. Drop this service and `tools.search_url` below
  # to run without web search, or swap in OpenSERP (`karust/openserp`,
  # `serve -a 0.0.0.0 -p 7000`) with `tools.search_backend = "openserp"`.
  searxng:
    image: searxng/searxng:latest
    environment:
      # Signs cookies, which the JSON API never hands out. DEMO ONLY, generate
      # your own (`openssl rand -hex 32`) for any real deployment.
      SEARXNG_SECRET: ChangeMeSearxngSecretAtLeast32Chars
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    restart: unless-stopped

  hivegent:
    image: ghcr.io/dfki-ebls/hivegent:latest
    depends_on:
      postgresql:
        condition: service_healthy
      rauthy:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      # Caddy's listen address. Read by the proxy, not the backend's TOML.
      CADDY_SITE_ADDRESS: ":8080"
      # The identity provider's origins, space-separated, which Caddy's
      # Content-Security-Policy lets the SPA reach for the sign-in. The image
      # refuses to start without them.
      CADDY_IDP_ORIGINS: "http://auth.localhost:8081"
      # Set to "true" to accept the additional terms of use (TERMS in the
      # repository), the backend refuses to start otherwise.
      HIVEGENT_ACCEPT_TERMS: "false"
    configs:
      # The backend reads its TOML config from here (HIVEGENT_CONFIG_FILE);
      # `HIVEGENT_*` env vars still override individual keys.
      - source: hivegent-config
        target: /data/config.toml
    # Secrets are files `hivegent.<NAME>` for the env var `HIVEGENT_<NAME>` they
    # replace, mounted under /run/secrets and readable by uid 65534. The demo
    # needs none, a hosted LLM would take its provider's key from the top-level
    # `secrets` entry below:
    # secrets:
    #   - hivegent.LLM__PROVIDERS__LOCAL__API_KEY
    # Loopback alone, a real deployment terminates TLS in front of it.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hivegent-data:/data
    restart: unless-stopped

# secrets:
#   hivegent.LLM__PROVIDERS__LOCAL__API_KEY:
#     file: ./secrets/llm-api-key

volumes:
  postgresql-data:
  rauthy-data:
  hivegent-data:

configs:
  postgresql-init:
    content: |
      -- Unprivileged role the backend connects as.
      CREATE ROLE hivegent LOGIN PASSWORD 'hivegent';
      -- Hand it the database so Alembic can create the schema.
      ALTER DATABASE hivegent OWNER TO hivegent;
      -- pgvector is untrusted (superuser-only to install), so create it here; the
      -- backend's `CREATE EXTENSION IF NOT EXISTS vector` then short-circuits
      -- before its own privilege check.
      CREATE EXTENSION IF NOT EXISTS vector;

  hivegent-config:
    content: |
      [db]
      url = "postgresql+psycopg://hivegent:hivegent@postgresql:5432/hivegent"

      # The model catalog, served by an OpenAI-compatible inference server on
      # the Docker host.
      [llm]
      default = "qwen"
      aux = "small"

      [llm.providers.local]
      base_url = "http://host.docker.internal:18000/v1"
      inference_provider = "llama.cpp"

      [llm.models.qwen]
      provider = "local"
      model = "qwen3.8-27b"
      family = "qwen"
      label = "Qwen 3.8 27B"
      reasoning = ["low", "medium", "high"]
      # Qwen3.8 implements xhigh in place of high.
      reasoning_overrides = { high = "xhigh" }
      vision = true

      [llm.models.small]
      provider = "local"
      model = "qwen3.5-0.8b"
      family = "qwen"
      vision = true
      chat = false

      # Validate tokens Rauthy issues for the SPA and the bridge bot.
      # The issuer exactly as Rauthy names it in its tokens, trailing slash included.
      [auth]
      issuer = "http://auth.localhost:8081/auth/v1/"
      audience = ["hivegent-spa", "hivegent-bot"]
      service_client_id = "hivegent-bot"

      # Enables web search through the SearXNG service.
      [tools]
      search_url = "http://searxng:8080"

      # Enables web fetch for every public page the user or a search named.
      [security.web_urls]
      allow_hosts = ["*"]

  searxng-settings:
    content: |
      use_default_settings: true
      search:
        # Hivegent is the only client, so only the JSON API is served.
        formats: [json]
      server:
        limiter: false
        public_instance: false
      # The default Tor engines fail to load without a Tor proxy.
      engines:
        - { name: ahmia, inactive: true }
        - { name: torch, inactive: true }
