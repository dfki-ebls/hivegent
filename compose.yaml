# Full example deployment of Hivegent with an OIDC provider (Rauthy).
#
# The all-in-one app image (backend + Caddy proxy/SPA) comes from this repo's Nix
# flake; the database is the upstream pgvector image and the IdP is the upstream
# Rauthy image. Build and push the flake image (per platform) with:
#
#   nix build .#packages.x86_64-linux.docker
#   ./result | gzip --fast | skopeo copy docker-archive:/dev/stdin \
#       docker://ghcr.io/dfki-ebls/hivegent:latest
#
# `./result | docker load` works too. The image is provider-agnostic: the SPA
# reads its OIDC issuer/client at runtime from the backend's `/api/config`, which
# the backend derives from HIVEGENT_AUTH__ISSUER (and HIVEGENT_AUTH__FRONTEND_CLIENT_ID,
# default "hivegent-spa"). Point those at whichever provider you run — Rauthy,
# Keycloak, Authentik, Auth0, ... — with no rebuild.
#
# First-run OIDC setup (each consumer does this themselves — the stack ships no
# client bootstrap): `docker compose up -d`, read the one-time admin password
# from `docker compose logs rauthy`, log in at http://auth.localhost:8081, and
# create a public `hivegent-spa` client (PKCE/S256) with redirect + allowed
# origin `http://localhost:8080`. Then open http://localhost:8080.
#
# Chat bridge (Teams/Slack/...): the all-in-one image can run the Vercel Chat SDK
# bridge as a third in-container service behind the same Caddy. Build the variant
# with `docker.override { enableBridge = true; }` (the `docker` package already
# threads the `bridge` package in), then on the `hivegent` service below: mount a
# `bridge-config.json` at `/data/bridge-config.json` (non-secrets: `hivegentUrl`,
# `oidc.issuer`, `oidc.clientId`, `adapters.teams`) and set the secrets as env
# (`POSTGRES_URL=postgres://hivegent:hivegent@postgresql:5432/hivegent`,
# `OIDC_CLIENT_SECRET`, and `TEAMS_APP_ID/PASSWORD/TENANT_ID` for Teams). Caddy then
# routes `/api/webhooks/*` to the bridge. Create a `hivegent-bot` client-credentials
# client in Rauthy (`CLIENT_CREDENTIALS_MAP_SUB = true` and a static custom `groups`
# claim `["team-kb:read"]`); the backend reads `custom.groups` by default, so no
# extra `[claims]` config is needed for the bot's group to be honoured.

name: hivegent

services:
  postgresql:
    image: pgvector/pgvector:pg18
    environment:
      # Bootstrap as the `postgres` superuser so the init config below can install
      # the (untrusted) `vector` extension; the backend connects as the
      # unprivileged `hivegent` role that same script creates.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hivegent
    configs:
      # Runs once on first init, as `postgres` against the `hivegent` database.
      - source: postgresql-init
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hivegent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.35.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # Networking. A *.localhost public URL resolves to loopback in the
      # browser automatically, while the backend reaches it via `extra_hosts`.
      LISTEN_SCHEME: http
      LISTEN_PORT_HTTP: "8080"
      PUB_URL: auth.localhost:8081
      PROXY_MODE: "false"
      HQL_INSECURE_COOKIE: "true" # the demo serves plain HTTP
      # Single-node embedded Hiqlite database (persisted at /app/data).
      HQL_NODE_ID: "1"
      HQL_NODES: "1 localhost:8100 localhost:8200"
      HQL_SECRET_RAFT: ChangeMeRaftSecretAtLeast16Chars
      HQL_SECRET_API: ChangeMeApiSecretAtLeast16Chars
      # Encryption keys — DEMO ONLY, generate your own for any real deployment.
      ENC_KEYS: bVCyTsGaggVy5yqQ/UzluN29DZW41M3hTSkx6Y3NtZmRuQkR2TnJxUTYzcjQ=
      ENC_KEY_ACTIVE: bVCyTsGaggVy5yqQ
      # WebAuthn / passkeys.
      RP_ID: auth.localhost
      RP_ORIGIN: http://auth.localhost:8081
      RP_NAME: Hivegent SSO
    volumes:
      - rauthy-data:/app/data
    ports:
      - "8081:8080"
    # Rauthy ships as a distroless image (no shell), so it carries no
    # in-container healthcheck. The backend tolerates it not being ready yet
    # via its restart policy, and the proxy waits on the backend instead.
    restart: unless-stopped

  hivegent:
    image: ghcr.io/dfki-ebls/hivegent:latest
    depends_on:
      postgresql:
        condition: service_healthy
      rauthy:
        condition: service_started
    extra_hosts:
      # Resolve the public issuer host to the Docker host so the backend fetches
      # OIDC discovery/JWKS from the same URL the browser uses.
      - "auth.localhost:host-gateway"
    environment:
      # Caddy's listen address — read by the proxy, not the backend's TOML.
      HIVEGENT_SITE_ADDRESS: ":8080"
    configs:
      # The backend reads its TOML config from here (HIVEGENT_CONFIG_FILE);
      # `HIVEGENT_*` env vars still override individual keys.
      - source: hivegent-config
        target: /data/config.toml
    ports:
      - "8080:8080"
    volumes:
      - hivegent-data:/data
    restart: unless-stopped
    # CUDA document/OCR models need the host GPU; uncomment for nvidia runtime.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgresql-data:
  rauthy-data:
  hivegent-data:

configs:
  postgresql-init:
    content: |
      -- Unprivileged role the backend connects as.
      CREATE ROLE hivegent LOGIN PASSWORD 'hivegent';
      -- Hand it the database so Alembic can create the schema.
      ALTER DATABASE hivegent OWNER TO hivegent;
      -- pgvector is untrusted (superuser-only to install), so create it here; the
      -- backend's `CREATE EXTENSION IF NOT EXISTS vector` then short-circuits
      -- before its own privilege check.
      CREATE EXTENSION IF NOT EXISTS vector;

  hivegent-config:
    content: |
      [db]
      url = "postgresql+psycopg://hivegent:hivegent@postgresql:5432/hivegent"

      # Point at an OpenAI-compatible inference server on the Docker host.
      [llm]
      model = "qwen3.6-27b"
      aux_model = "qwen3.5-0.8b"
      base_url = "http://host.docker.internal:18000/v1"
      inference_provider = "llama.cpp"

      # Validate tokens Rauthy issues for the hivegent-* clients.
      [auth]
      issuer = "http://auth.localhost:8081/auth/v1"
      audience = ["hivegent-*"]
