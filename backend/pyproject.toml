[project]
name = "hivegent"
version = "0.1.0"
description = "Agentic system for non-expert users to interact with LLMs guided by experience"
readme = "README.md"
requires-python = ">=3.13,<4"
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
dependencies = [
  "argon2-cffi>=25,<26",
  "cbrkit>=1,<2",
  "chonkie>=1,<2",
  "fastapi[standard]>=0.120,<1",
  "fastmcp>=3,<4",
  "frozendict>=2.4.7",
  "httpx>=0.28,<1",
  "joserfc>=1,<2",
  "lancedb>=0.29,<1",
  "logfire>=4,<5",
  "nanoid>=2,<3",
  "opentelemetry-instrumentation-fastapi>=0.60b1",
  "pydantic-ai-slim[ui,openai]>=1,<2",
  "pydantic-settings>=2,<3",
  "pypandoc>=1,<2",
  "ripgrepy>=2,<3",
  "sentence_transformers>=5,<6",
  "typer>=0.21,<1",
  "uvicorn[standard]>=0.40,<1",
  "zvec>=0.2,<1",
]

[project.scripts]
hivegent = "hivegent.cli:app"

[project.optional-dependencies]
marker = ["marker-pdf[full]>=1,<2"]
docling = ["docling>=2,<3"]
markitdown = ["markitdown[all]>=0.1,<1"]
kreuzberg = ["kreuzberg>=4,<5"]
# mineru = ["mineru[all]>=2,<3"]
all = ["hivegent[marker,docling,kreuzberg,markitdown]"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "inline-snapshot>=0.19,<1",
  "pydantic-evals>=1,<2",
  "dirty-equals>=0.8,<1",
]

[build-system]
requires = ["uv-build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.uv.sources]
cbrkit = { path = "../../../wi2trier/cbrkit", editable = true }
zvec = { git = "https://github.com/alibaba/zvec", tag = "v0.2.0" }
