[project]
name = "snipscout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<4"
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
dependencies = [
  "argon2-cffi>=25.1.0",
  "bm25s[core]>=0.2,<1",
  "fastapi[standard]>=0.120,<1",
  "httpx>=0.28.1",
  "joserfc>=1.6.1",
  "logfire>=4,<5",
  "nanoid>=2,<3",
  "pydantic-ai-slim[ui,openai]>=1,<2",
  "pydantic-settings>=2,<3",
  "ripgrepy>=2,<3",
  "typer>=0.21.1",
  "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
snipscout = "snipscout.cli:app"

[build-system]
requires = ["uv-build>=0.9,<1"]
build-backend = "uv_build"
