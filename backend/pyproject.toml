[project]
name = "snipscout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<4"
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
dependencies = [
  "argon2-cffi>=25,<26",
  "bm25s[core]>=0.2,<1",
  "chonkie>=1,<2",
  "fastapi[standard]>=0.120,<1",
  "httpx>=0.28,<1",
  "joserfc>=1,<2",
  "logfire>=4,<5",
  "nanoid>=2,<3",
  "pydantic-ai-slim[ui,openai]>=1,<2",
  "pydantic-settings>=2,<3",
  "ripgrepy>=2,<3",
  "typer>=0.21,<1",
  "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
snipscout = "snipscout.cli:app"

[project.optional-dependencies]
# currently there is a conflict for mineru with python 3.14, leave this out for now
# marker = ["marker-pdf[full]>=1"]
# docling = ["docling>=2"]
# mineru = ["mineru[all]>=2"]
# all-converters = ["snipscout[marker,docling,mineru]"]

[build-system]
requires = ["uv-build>=0.9,<1"]
build-backend = "uv_build"
