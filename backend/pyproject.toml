[project]
name = "hivegent"
version = "0.0.1"
description = "Agentic system for non-expert users to interact with LLMs guided by experience"
readme = "README.md"
requires-python = ">=3.13,<4"
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
dependencies = [
  "alembic>=1,<2",
  "cbrkit[http,openai,sql,pgvector]>=1.5.6,<2",
  "chonkie>=1,<2",
  "fastapi[standard]>=0.120,<1",
  "fastexcel>=0.20,<1",
  "fastmcp>=3,<4",
  "firecrawl-anydoc>=0.1,<0.2",
  "frozendict>=2.4.7",
  "httpcore>=1,<2",
  "httpcore2>=2,<3",
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "joserfc>=1,<2",
  "logfire>=4,<5",
  "lxml>=6,<7",
  "markdownify>=1,<2",
  "nanoid>=2,<3",
  "opentelemetry-exporter-otlp-proto-http>=1,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b1",
  "openai>=3,<4",
  "pdf-inspector>=1,<2",
  "polars>=1,<2",
  "psycopg[binary]>=3,<4",
  "pydantic-ai-slim[ui,openai,mcp]>=2,<3",
  "pydantic-settings>=2,<3",
  "pypdfium2>=5,<6",
  "sentence_transformers>=5,<6",
  "sqlalchemy[asyncio]>=2,<3",
  "typer>=0.20,<1",
  "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
hivegent = "hivegent.cli:app"

[project.optional-dependencies]
all = ["hivegent[docling,pdf-oxide,semantic]"]
# code = ["chonkie[code]>=1,<2"]
# marker = ["marker-pdf[full]>=1,<2"]
# mineru = ["mineru[all]>=3,<4"]
docling = ["docling>=2,<3", "tesserocr>=2,<3"]
kreuzberg = ["kreuzberg>=4,<5"]
markitdown = ["markitdown[all]>=0.1,<1"]
pdf-oxide = ["pdf_oxide>=0.3,<1"]
semantic = ["chonkie[semantic]>=1,<2"]

[dependency-groups]
dev = [
  "dirty-equals>=0.10,<1",
  "inline-snapshot>=0.30,<1",
  "openpyxl>=3,<4",
  "pip-licenses>=5,<6",
  "pydantic-evals>=2,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["uv-build>=0.11,<1"]
build-backend = "uv_build"

[tool.alembic]
script_location = "src/hivegent/migrations"
prepend_sys_path = ["src"]
timezone = "UTC"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"

[tool.basedpyright]
# SQLAlchemy 2.0 ``Mapped[T] = mapped_column(...)`` declarations are
# initialized by the ORM metaclass at runtime, but basedpyright cannot see
# through that and flags every column as uninitialized.  Disable globally
# because every legitimate uninitialized-attribute case in this repo also
# happens to be ORM-shaped.
reportUninitializedInstanceVariable = false

[tool.logfire]
# `configure_observability` is a no-op unless an OTLP endpoint or
# `LOGFIRE_TOKEN` is set; suppress the noisy warning otherwise.
ignore_no_config = true

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
# FastMCP declares dependencies through call expressions in argument defaults;
# the signature *is* the injection point, so these are not mutable defaults.
extend-immutable-calls = ["fastmcp.dependencies.CurrentAccessToken", "fastmcp.dependencies.Depends"]

[tool.uv.exclude-newer-package]
cbrkit = false
# pdf-inspector 1.x landed within the global soak window; drop this override
# once the cutoff has caught up with it.
pdf-inspector = false
pydantic-ai-slim = "1 day"
pydantic-graph = "1 day"
pydantic-evals = "1 day"

[tool.uv.extra-build-dependencies]
antlr4-python3-runtime = ["setuptools"]
ebooklib = ["setuptools"]
pylatexenc = ["setuptools"]
cysignals = ["meson-python", "cython"]

[tool.uv.sources]
# cbrkit = { path = "../../../wi2trier/cbrkit", editable = true }
