[project]
name = "hivegent-backend"
version = "0.0.1"
description = "Agentic system for non-expert users to interact with LLMs guided by experience"
readme = "README.md"
requires-python = ">=3.14,<4"
license = "MIT"
license-files = ["LICENSE", "TERMS"]
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
dependencies = [
  "alembic>=1,<2",
  "cachetools>=8,<9",
  "cbrkit[bpmn,http,pgvector,pydantic-ai,transformers]",
  "chonkie>=1,<2",
  "cryptography>=50,<51",
  "exar[anydoc,cbrkit,chonkie,eval,media,pdf-inspector,table]",
  "fastapi[standard]>=0.163,<0.164",
  "fastmcp>=4,<5",
  "frozendict>=2,<3",
  "httpx2>=2,<3",
  "joserfc>=1,<2",
  "logfire>=5,<6",
  "markdown-it-py>=4,<5",
  "markdownify>=1,<2",
  "openai>=3,<4",
  "opentelemetry-exporter-otlp-proto-http>=1,<2",
  "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
  "pillow>=13,<14",
  "polars>=2,<3",
  "psycopg[binary]>=3,<4",
  "pydantic-ai-harness>=0.68,<0.69",
  "pydantic-ai-slim[ui,openai,mcp]>=2,<3",
  "pydantic-monty>=1,<2",
  "pydantic-settings>=2,<3",
  "pyspellchecker>=0.9,<0.10",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2,<3",
  # Transitive via cbrkit and exar, direct only so `tool.uv.sources` applies.
  "torch>=2,<3",
  "trafilatura>=2,<3",
  "typer>=0.27,<0.28",
  "uvicorn[standard]>=0.54,<0.55",
]

[project.scripts]
hivegent = "hivegent.cli:app"

[project.optional-dependencies]
all = ["hivegent-backend[docling,pdf-oxide,semantic]"]
docling = ["exar[docling]", "torchvision>=0.29,<0.30"]
kreuzberg = ["exar[kreuzberg]"]
markitdown = ["exar[markitdown]"]
pdf-oxide = ["exar[pdf-oxide]"]
semantic = ["exar[semantic]"]

[dependency-groups]
dev = [
  "dirty-equals>=0.11,<0.12",
  "inline-snapshot>=0.36,<0.37",
  "jsonschema>=4,<5",
  "openpyxl>=3,<4",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["uv-build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.alembic]
script_location = "src/hivegent/migrations"
prepend_sys_path = ["src"]
timezone = "UTC"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"

[tool.basedpyright]
# Pin the deployment target so typeshed's platform-conditional stubs resolve to
# the branch that actually runs.  The default (`All`) also considers the win32
# branch, which is where `multiprocessing.Pipe` yields `PipeConnection` and no
# amount of local casting reads honestly.
pythonPlatform = "Linux"
# Pydantic's `TypeAdapter` takes a `TypeForm` (PEP 747), which pyright only
# infers for type aliases and `Annotated` forms behind this flag.
enableExperimentalFeatures = true

[tool.logfire]
# `configure_observability` is a no-op unless an OTLP endpoint or
# `logfire.token` is set, suppress the noisy warning otherwise.
ignore_no_config = true

[tool.pytest]
# Optional converter backends may be absent, and alembic env.py only runs under alembic.
addopts = [
  "--doctest-modules",
  "--doctest-ignore-import-errors",
  "--ignore=src/hivegent/migrations",
]
# docling's own pipeline cache key serializes its options, deprecated computed
# fields included, so `force_full_page_ocr` warns although nothing here sets it.
filterwarnings = ["ignore:`force_full_page_ocr` is deprecated:DeprecationWarning"]
testpaths = ["src", "tests"]
asyncio_mode = "auto"

# Makes this file the ruff config wherever ruff runs from, so `nix fmt` at the
# repository root sorts `hivegent` as first-party as a run from here does.
[tool.ruff]
src = ["src"]

# Ruff only recognizes a pydantic model that subclasses `BaseModel` within the
# same file, so it flags the mutable defaults of the settings sections.
[tool.ruff.lint.per-file-ignores]
"src/hivegent/config/*.py" = ["RUF012"]

# The distribution is named for the artifact it ships, the import package for
# the system it belongs to, so the module has to be named rather than derived.
[tool.uv.build-backend]
module-name = "hivegent"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.exclude-newer-package]
cbrkit = false
exar = false

[tool.uv.extra-build-dependencies]
antlr4-python3-runtime = ["setuptools"]
ebooklib = ["setuptools"]
pylatexenc = ["setuptools"]
# No wheel matches nixpkgs' darwin SDK (tesserocr's macOS wheels are tagged
# macosx_15_0, while `stdenv.hostPlatform.darwinSdkVersion` is 14.4), so darwin
# builds the sdist, which declares no build backend at all.
tesserocr = ["setuptools", "cython"]

[tool.uv.sources]
# PyPI's Linux wheels bundle CUDA, macOS has only PyPI's CPU and MPS builds.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
# The owner's checkouts until cbrkit 2 and exar are released, which the nix
# build then needs, as it cannot reach these paths.
cbrkit = { path = "../../../wi2trier/cbrkit", editable = true }
exar = { path = "../../../wi2trier/exar", editable = true }
