name: release
on:
  push:
    branches: [main]
jobs:
  check:
    uses: ./.github/workflows/check.yml
  release:
    if: false # ${{ github.repository_owner == 'dfki-ebls' }}
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: release
      url: https://github.com/dfki-ebls/hivegent/releases/tag/${{ steps.semanticrelease.outputs.git-tag }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semanticrelease.outputs.version }}
      released: ${{ steps.semanticrelease.outputs.released }}
      git-head: ${{ steps.semanticrelease.outputs.git-head }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: cihelper/action-semanticrelease-generic@979f570eb05d095439749655ef7613dfa78dd2a3 # v1.2.3
        id: semanticrelease
  # Multi-arch container publish to GHCR. Disabled for now: to enable, add a
  # `docker-manifest` output to the flake (flocken's `mkDockerManifest` over the
  # x86_64/aarch64 `docker` image streams) and replace `if: false` with the
  # release gate shown after the `#`.
  deploy-docker:
    runs-on: ubuntu-latest
    needs: release
    if: false # ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
      packages: write
    environment:
      name: release
      url: https://ghcr.io/dfki-ebls/hivegent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.release.outputs.git-head }}
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          platforms: arm64
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            accept-flake-config = true
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: dfki-ebls
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix run .#docker-manifest --impure
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
