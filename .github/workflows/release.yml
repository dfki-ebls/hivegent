name: release
on:
  workflow_dispatch:
permissions: {}
# Never cancel a running release halfway through publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read
    secrets:
      CACHIX_TOKEN: ${{ secrets.CACHIX_TOKEN }}
  release:
    name: Semantic release
    if: ${{ github.repository_owner == 'dfki-ebls' }}
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: release
      url: https://github.com/dfki-ebls/hivegent/releases/tag/${{ steps.semanticrelease.outputs.new_release_git_tag }}
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
    outputs:
      version: ${{ steps.semanticrelease.outputs.new_release_version }}
      released: ${{ steps.semanticrelease.outputs.new_release_published }}
      git-head: ${{ steps.semanticrelease.outputs.new_release_git_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_TOKEN }}
      - run: nix profile install .#release-env
      - uses: cycjimmy/semantic-release-action@v8
        id: semanticrelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          semantic_version: 25
          extra_plugins: |
            @cihelper/semanticrelease-plugin-uv@1
            @semantic-release/changelog@6
            @semantic-release/exec@7
            @semantic-release/git@10
            semantic-release-major-tag@0.3
            conventional-changelog-conventionalcommits@9

  # The release commit bumps every version, so its checks build the images and
  # SBOMs again, natively per platform, which leaves the publish job only substitutes.
  check-release:
    uses: $/.github/workflows/check.yml
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
    with:
      ref: ${{ needs.release.outputs.git-head }}
    secrets:
      CACHIX_TOKEN: ${{ secrets.CACHIX_TOKEN }}

  deploy-docker:
    name: Docker publish
    runs-on: ubuntu-latest
    needs:
      - release
      - check-release
    permissions:
      contents: read
      packages: write # push the image index to GHCR
      id-token: write # sign with keyless cosign and attest the provenance
      attestations: write # store the provenance attestation
    environment:
      name: release
      url: https://github.com/dfki-ebls/hivegent/pkgs/container/hivegent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.git-head }}
      - uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_TOKEN }}
      - run: nix run .#docker-manifest
        id: manifest
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.manifest.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  build-docs:
    name: Docs build
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.git-head }}
      - uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_TOKEN }}
      - run: nix build .#docs-pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./result

  deploy-docs:
    name: Docs publish
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write # deploy the handbook to GitHub Pages
      id-token: write # authenticate the deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
