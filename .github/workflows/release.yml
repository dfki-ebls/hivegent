name: release
on:
  workflow_dispatch:
permissions: {}
# Never cancel a running release halfway through publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read
    secrets:
      CACHIX_TOKEN: ${{ secrets.CACHIX_TOKEN }}
  release:
    name: Semantic release
    if: ${{ github.repository_owner == 'dfki-ebls' }}
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: release
      url: https://github.com/dfki-ebls/hivegent/releases/tag/${{ steps.semanticrelease.outputs.new_release_git_tag }}
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
    outputs:
      version: ${{ steps.semanticrelease.outputs.new_release_version }}
      released: ${{ steps.semanticrelease.outputs.new_release_published }}
      git-head: ${{ steps.semanticrelease.outputs.new_release_git_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: dfki-ebls
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix profile install .#release-env
      - uses: cycjimmy/semantic-release-action@v8
        id: semanticrelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          semantic_version: 25
          extra_plugins: |
            @cihelper/semanticrelease-plugin-uv@1
            @semantic-release/changelog@6
            @semantic-release/exec@7
            @semantic-release/git@10
            semantic-release-major-tag@0.3
            conventional-changelog-conventionalcommits@9

  # Multi-arch container publish to GHCR. Disabled for now: to enable, add a
  # `docker-manifest` output to the flake (flocken's `mkDockerManifest` over the
  # x86_64/aarch64 `docker` image streams) and replace `if: false` with the
  # release gate shown after the `#`.
  deploy-docker:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: release
    if: false # ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
      packages: write # push the container image to GHCR
    environment:
      name: release
      url: https://ghcr.io/dfki-ebls/hivegent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.git-head }}
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: dfki-ebls
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix run .#docker-manifest --impure
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
