name: check
on:
  pull_request:
  workflow_call:
    secrets:
      CACHIX_TOKEN:
        required: false
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Flake check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            accept-flake-config = true
            log-lines = 1000
      - uses: cachix/cachix-action@v17
        with:
          name: dfki-ebls
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix flake check --show-trace --no-build
