name: check
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check instead of the triggering one
        type: string
        default: ""
    secrets:
      CACHIX_TOKEN:
        required: false
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Flake check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: $/.github/actions/setup-nix
        with:
          # A pull request only reads the cache, so it cannot plant a store path that a release substitutes.
          cachix-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_TOKEN || '' }}
      # Builds only the checks missing from the cache, and outside pull requests pushes their closures.
      - run: >-
          nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom --no-link
          ${{ github.event_name != 'pull_request' && '--cachix-cache=dfki-ebls' || '' }}
