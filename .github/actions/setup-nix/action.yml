name: setup-nix
description: Install Nix on a runner freed of preinstalled software and configure the dfki-ebls Cachix cache
inputs:
  cachix-token:
    description: Cachix auth token, without which the cache is only read
    required: false
runs:
  using: composite
  steps:
    - uses: wimpysworld/nothing-but-nix@v12
    - uses: DeterminateSystems/nix-installer-action@v23
      with:
        extra-conf: log-lines = 1000
    - uses: cachix/cachix-action@v17
      with:
        name: dfki-ebls
        authToken: ${{ inputs.cachix-token }}
        # Only the runtime closures of the checks are pushed (`check.yml`), which
        # leaves out what builds merely download, such as sources and wheels.
        skipPush: true
