<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hivegent">
  <defs>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDA6B"/>
      <stop offset="1" stop-color="#F2A41C"/>
    </linearGradient>
    <clipPath id="dome">
      <path d="M17 49C17 41 17 28 26 22Q32 18 38 22C47 28 47 41 47 49Z"/>
    </clipPath>
    <clipPath id="beeBody">
      <ellipse cx="17" cy="16" rx="6" ry="4.3"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <circle cx="32" cy="32" r="30" fill="#FFE9A6" stroke="#2A1E0B" stroke-width="3"/>

  <!-- Document with folded corner -->
  <path d="M20 11L40 11L48 19L48 47Q48 51 44 51L20 51Q16 51 16 47L16 15Q16 11 20 11Z"
        fill="#FFF7DC" stroke="#2A1E0B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M40 11L48 19L40 19Z" fill="#EBCB7E" stroke="#2A1E0B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Hive -->
  <g stroke="#2A1E0B" stroke-width="2.4" stroke-linejoin="round">
    <path d="M17 49C17 41 17 28 26 22Q32 18 38 22C47 28 47 41 47 49Z" fill="url(#honey)"/>
    <g clip-path="url(#dome)" stroke-linecap="round">
      <line x1="14" y1="27" x2="50" y2="27"/>
      <line x1="14" y1="34" x2="50" y2="34"/>
      <line x1="14" y1="41" x2="50" y2="41"/>
    </g>
    <rect x="29" y="44" width="6" height="5" rx="1.5" fill="#2A1E0B" stroke="none"/>
  </g>

  <!-- Bee -->
  <g transform="rotate(18 17 16)" stroke="#2A1E0B" stroke-linejoin="round">
    <ellipse cx="16.5" cy="10.5" rx="4.4" ry="2.8" fill="#FFFFFF" fill-opacity="0.95" stroke-width="1.2"/>
    <ellipse cx="17" cy="16" rx="6" ry="4.3" fill="#FBC02D" stroke-width="1.6"/>
    <g clip-path="url(#beeBody)" fill="#2A1E0B" stroke="none">
      <rect x="14" y="11" width="2" height="10"/>
      <rect x="18" y="11" width="2" height="10"/>
    </g>
    <circle cx="22.5" cy="16" r="2.7" fill="#2A1E0B" stroke="none"/>
  </g>
</svg>
